backend:
  name: github
  repo: xlan11/ux-alan
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth
media_folder: public/uploads
public_folder: /uploads
collections:
  - name: projects
    label: Case studies
    folder: src/content/projects
    create: true
    slug: '{{slug}}'
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Eyebrow, name: eyebrow, widget: string, default: Case study }
      - { label: Summary, name: summary, widget: text }
      - { label: Description, name: description, widget: text }
      - { label: Number, name: number, widget: string }
      - { label: Accent, name: accent, widget: select, options: [coral, blue, green] }
      - { label: Tags, name: tags, widget: list }
      - { label: Introduction, name: intro, widget: text }
      - label: Sections
        name: sections
        widget: list
        fields:
          - { label: Heading, name: heading, widget: string }
          - { label: Body, name: body, widget: text }
